name: FTP Diagnose

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Inspeccionar carpeta servida
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lftp >/dev/null 2>&1
          ABS="/home/$FTP_USERNAME/domains/papstexaslogistics.com/public_html"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; echo '=== RAIZ (home) ==='; cls -la /; echo '=== CD a ruta absoluta servida ==='; cd \"$ABS\"; pwd; echo '=== LS de la carpeta servida ==='; cls -la .; echo '=== find en carpeta servida ==='; find -d 2 .; quit" > out.txt 2>&1 || true
          echo "################ SALIDA ################"
          cat out.txt
          echo "################ index.html encontrados ################"
          grep -in "index" out.txt || echo "(ninguno)"
