name: FTP Diagnose

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Explorar /domains
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lftp >/dev/null 2>&1
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; echo '=== LS /domains/ ==='; cls -la /domains/; echo '=== FIND /domains (4 niveles) ==='; find -d 4 /domains/; echo '=== LS /public_html (donde aterrizo) ==='; cls -la /public_html/; quit" > out.txt 2>&1 || true
          echo "################ SALIDA ################"
          cat out.txt
