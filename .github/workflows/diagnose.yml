name: FTP Diagnose

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Listar árbol FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lftp >/dev/null 2>&1
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<'EOF' > out.txt 2>&1
          set ssl:verify-certificate no
          set net:max-retries 2
          echo "=== PWD (donde aterriza el FTP) ==="
          pwd
          echo "=== LS raiz FTP ==="
          cls -la .
          echo "=== Arbol (hasta 4 niveles) ==="
          find -d 4 .
          quit
          EOF
          echo "################ PWD y raiz ################"
          sed -n '1,60p' out.txt
          echo "################ Ubicaciones de index.html ################"
          grep -in "index.html" out.txt || echo "(no encontrado en el listado)"
          echo "################ Ubicaciones de send.php ################"
          grep -in "send.php" out.txt || echo "(no encontrado)"
          echo "################ Carpetas public_html ################"
          grep -in "public_html" out.txt || echo "(no encontrado)"
