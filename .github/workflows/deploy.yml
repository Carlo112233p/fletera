name: Deploy to Hostinger

# Se ejecuta automáticamente en cada push a la rama main
on:
  push:
    branches: [main]
  # Permite lanzarlo manualmente desde la pestaña Actions de GitHub
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Subir por FTP a Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # La cuenta FTP aterriza directamente dentro de public_html,
          # así que la raíz "./" ES el web root del sitio.
          server-dir: ./
          # Solo sube los archivos del sitio web
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            *.numbers
            *.xlsx
            build_excel.py
            build_numbers.py
